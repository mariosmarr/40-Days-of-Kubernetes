apiVersion: v1
kind: Pod
metadata:
  name: myapp
  labels:
    name: myapp-pod
spec:
  containers:
  - name: mycontainer
    image: busybox:1.28
    command: ['sh','-c','echo waiting for the app to start && sleep 3600']
    env:
    - name: FIRSTNAME
      value: 'marios'
  initContainers:
  - name: myinit
    image: busybox:1.28
    command: ['sh','-c','until nslookup myservice.default.svc.cluster.local;do echo waiting for the service to be upp;sleep 5;done'] 
  - name: myinit2
    image: busybox:1.28
    command: ['sh','-c','until nslookup myservice2.default.svc.cluster.local;do echo waiting for the service to be up;sleep 6;done']  



      